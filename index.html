<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Hello, World — A Little Spark</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home">
  <div class="stars" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">✦</span> A Little Spark</a>
    <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <div class="orb" aria-hidden="true"><span>✦</span></div>
    <p class="eyebrow">A tiny beginning</p>
    <h1>Hello,<span>World.</span></h1>
    <p class="intro">Every great idea starts somewhere. Here’s to the first line, the blank canvas, and everything you’ll make next.</p>
    <button id="helloButton" type="button"><span aria-hidden="true">✧</span> Say hello</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <footer>Made for what comes next</footer>
  <script>
    const button = document.querySelector('#helloButton');
    const message = document.querySelector('#message');
    button.addEventListener('click', () => {
      message.textContent = 'Hello right back ✨';
      button.innerHTML = '<span aria-hidden="true">✓</span> Hello sent';
    });
  </script>
</body>
</html>
